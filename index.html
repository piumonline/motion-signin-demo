<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A playful, responsive sign-in demo built with HTML and Tailwind CSS.">
  <meta name="theme-color" content="#e7e5e8">
  <title>Welcome back — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
  <script src="./characters.js" defer></script>
</head>
<body class="bg-[#e7e5e8] font-sans text-[#111212] antialiased">
  <main class="grid min-h-svh grid-cols-1 p-3 md:grid-cols-[57.6%_42.4%] md:p-5">
    <section class="grid place-items-center overflow-hidden px-6 py-8 md:h-[calc(100svh-40px)] md:self-start md:px-[13.8%] md:py-0" aria-label="Playful geometric characters">
      <svg class="character-art max-h-[220px] md:max-h-none" viewBox="0 14 451 386" fill="none" role="img" aria-labelledby="art-title">
        <title id="art-title">Four colorful friends welcoming you back</title>
        <path d="M118 16a2 2 0 0 1 2-2h174a2 2 0 0 1 2 2v384H118V16Z" fill="#6200F5"/>
        <g class="shy-eye"><circle cx="144" cy="48" r="5.5" fill="white"/><circle class="pupil" cx="142" cy="49" r="3" fill="#18191A"/><circle cx="196" cy="44" r="5.5" fill="white"/><circle class="pupil" cx="194" cy="45" r="3" fill="#18191A"/></g>
        <ellipse cx="172" cy="67" rx="11" ry="4.5" fill="#291361"/>
        <path d="M247 129a2 2 0 0 1 2-2h105a2 2 0 0 1 2 2v271H247V129Z" fill="#18191A"/>
        <g class="shy-eye"><circle cx="260" cy="149" r="9" fill="white"/><circle class="pupil" cx="258" cy="149" r="5.5" fill="#18191A"/><circle cx="289" cy="153" r="9" fill="white"/><circle class="pupil" cx="287" cy="154" r="5.5" fill="#18191A"/></g>
        <path d="M327 262a62 62 0 0 1 124 0v138H327V262Z" fill="#E7D500"/>
        <ellipse class="shy-eye" cx="384" cy="245" rx="4.5" ry="6" fill="#18191A"/>
        <path d="M327 266h59" stroke="#18191A" stroke-width="6"/>
        <path d="M0 400c6-88 69-153 147-153s147 65 150 153H0Z" fill="#FF6C24"/>
        <path d="m59 297 8 2m60 10 8 2" stroke="#551900" stroke-width="5.5" stroke-linecap="round"/>
        <path d="m81 310 30 6s-6 17-17 13c-11-4-13-19-13-19Z" fill="#551900"/>
      </svg>
    </section>

    <section id="signin-panel" class="relative flex min-h-[640px] flex-col items-center rounded-[22px] bg-white px-9 pb-14 pt-14 md:min-h-[calc(100svh-40px)] md:rounded-[24px] md:px-[19%] md:justify-center md:py-16">
      <svg width="43" height="43" viewBox="0 0 43 43" fill="none" aria-label="Brand" role="img" class="shrink-0">
        <path d="M21.5 2C15 2 15.3 15.5 15.3 15.5S2 14.9 2 21.5s13.3 6 13.3 6S15 41 21.5 41s6.2-13.5 6.2-13.5S41 28.1 41 21.5s-13.3-6-13.3-6S28 2 21.5 2Z" fill="#0B0E0B"/>
      </svg>
      <header class="mt-[46px] w-full text-center">
        <h1 class="whitespace-nowrap text-[29px] font-semibold leading-tight tracking-[-1px] lg:text-[32px]">Welcome back!</h1>
        <p class="mt-3 text-[12px] text-[#6c696e]">Please enter your details</p>
      </header>

      <form id="signin-form" class="mt-[47px] w-full" novalidate>
        <div class="field relative h-[49px]">
          <input id="email" name="email" type="email" autocomplete="username" placeholder=" " required class="h-full w-full bg-transparent pt-3 text-[14px]" aria-describedby="email-error">
          <label for="email" class="text-[14px]">Email</label>
        </div>
        <p id="email-error" class="mt-1 hidden text-[11px] text-[#c73232]"></p>
        <div class="field relative mt-[25px] flex h-[49px] items-center">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder=" " required minlength="6" class="h-full w-full bg-transparent pr-10 pt-3 text-[14px]" aria-describedby="password-error">
          <label for="password" class="text-[14px]">Password</label>
          <button id="toggle-password" type="button" aria-label="Show password" aria-pressed="false" class="absolute -right-2 flex h-11 w-11 items-center justify-center rounded-full hover:bg-stone-50">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.6"/><ellipse cx="12" cy="12" rx="3.2" ry="5.7" stroke="currentColor" stroke-width="1.6"/><path id="eye-slash" d="m4 3 16 18" stroke="currentColor" stroke-width="1.6" class="hidden"/></svg>
          </button>
        </div>
        <p id="password-error" class="mt-1 hidden text-[11px] text-[#c73232]"></p>
        <div class="mt-[18px] flex items-center justify-between gap-2 text-[9px]">
          <label class="flex cursor-pointer items-center gap-1.5 whitespace-nowrap"><input type="checkbox" id="remember" name="remember" checked class="size-3 accent-[#18191a]">Remember for 30 days</label>
          <button id="forgot-password" type="button" class="min-h-6 whitespace-nowrap text-[#89848e] hover:text-[#6200f5]">Forgot password?</button>
        </div>
        <button id="login-button" type="submit" class="mt-[30px] flex h-[49px] w-full items-center justify-center rounded-full border-2 border-[#111212] bg-[#18191a] text-[14px] font-medium text-white transition hover:bg-[#333035] active:scale-[.99] disabled:cursor-wait disabled:opacity-70">Log in</button>
        <button id="google-login" type="button" class="mt-[17px] flex h-[49px] w-full items-center justify-center gap-2.5 rounded-full bg-[#f4f2f6] text-[13px] font-semibold transition hover:bg-[#eae6ef] active:scale-[.99]">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.52h3.24c1.9-1.75 2.98-4.32 2.98-7.37Z"/><path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.4l-3.24-2.52c-.9.6-2.05.97-3.38.97-2.6 0-4.8-1.76-5.59-4.12H3.07v2.59A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.41 13.93a6 6 0 0 1 0-3.86V7.48H3.07a10 10 0 0 0 0 9.04l3.34-2.59Z"/><path fill="#EA4335" d="M12 5.95c1.47 0 2.79.51 3.82 1.51l2.87-2.87A9.58 9.58 0 0 0 12 2a10 10 0 0 0-8.93 5.48l3.34 2.59C7.2 7.71 9.4 5.95 12 5.95Z"/></svg>
          Log in with Google
        </button>
        <p id="form-status" role="status" aria-live="polite" class="mt-4 text-center text-[11px] leading-relaxed text-[#625c68]"></p>
      </form>
      <p class="mt-auto pt-14 text-center text-[10px] md:mt-0">Don't have an account? <button id="signup" type="button" class="font-semibold hover:text-[#6200f5]">Sign Up</button></p>
    </section>
  </main>

  <dialog id="info-dialog" class="m-auto w-[calc(100%-32px)] max-w-sm rounded-3xl border-0 bg-white p-8 text-[#18191a] shadow-xl">
    <h2 id="dialog-title" class="text-xl font-semibold"></h2>
    <p id="dialog-description" class="mt-3 text-sm leading-6 text-stone-600"></p>
    <form method="dialog"><button class="mt-6 w-full rounded-full bg-[#18191a] px-5 py-3 text-sm text-white hover:bg-[#333035]">Got it</button></form>
  </dialog>
</body>
</html>
